# ─────────────────────────────────────────────────────────────────────────
# pfl — Polish as a foreign language. Instantiated from the canonical
# boulingua `pagegen` template (Hugo + hugo-coder).
#
# Everything outside the per-course values below is the shared standard and
# should NOT be edited here; fix it in `pagegen` and re-align.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/pfl/"
title = "PFL — Polish"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Polski"
  author = "S. Le Boulanger"
  description = "A free, CEFR-aligned Polish course in English: a pre-A1 pronunciation and orthography primer, then A1 to B2 units, model exams, printable materials and native-voice audio."
  keywords = "Polish,polski,Polish as a foreign language,PFL,CEFR,A1,A2,B1,B2,declension,cases,verbal aspect,pronunciation,OER,open educational resources"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent (#AD701F) from data/accents.yaml.
  code = "pfl"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany) — the same instance the sister courses use.
    domain = "boulingua.github.io/pfl"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/pfl"

